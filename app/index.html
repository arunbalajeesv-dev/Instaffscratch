<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instaff</title>
<meta name="description" content="Instaff booking prototype — nine services on one config-driven engine.">
<meta name="theme-color" content="#0F7A63">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F7A63'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='sans-serif' font-weight='bold' fill='white'>i</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --primary:#0F7A63;--dark:#0B5F4D;--tint:#EAF6F2;--tint-border:#BFE3D8;
  --page:#F6F8F7;--card-border:#E3E8E5;--text:#14201C;--muted:#5B6B65;
  --warn-text:#8A4B12;--warn-bg:#FDF6F0;--warn-border:#F0D5C0;--white:#FFFFFF;
  --shell:#DFE7E3;
  --font:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--shell);color:var(--text);
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
}
button{font-family:inherit;cursor:pointer}

/* ---- device shell: full bleed on phones, a framed phone on desktop ---- */
#app{
  width:100%;height:100%;max-width:430px;background:var(--page);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
@media (min-width:760px) and (min-height:760px){
  body{padding:24px}
  #app{height:860px;max-height:100%;border-radius:30px;border:1px solid #C9D5D0;
    box-shadow:0 30px 70px -40px rgba(11,95,77,.55)}
}

/* ---- top bar ---- */
.topbar{flex:0 0 auto;background:var(--white);border-bottom:1px solid var(--card-border);
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.tbrow{display:flex;align-items:center;gap:8px;min-height:40px}
.iconbtn{width:40px;height:40px;margin-left:-8px;border:0;background:none;display:grid;place-items:center;
  color:var(--text);border-radius:12px;flex:0 0 auto}
.iconbtn:disabled{opacity:0;pointer-events:none}
.tbtitle{font-size:17px;font-weight:800;letter-spacing:-.015em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbsub{font-size:12px;font-weight:600;color:var(--muted);margin:3px 0 8px}
.bars{display:flex;gap:6px}
.bar{height:4px;flex:1;border-radius:99px;background:var(--card-border);transition:background .2s}
.bar.on{background:var(--primary)}

/* ---- scroll area ---- */
.screen{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 16px 20px;display:flex;flex-direction:column;gap:20px}
.screen::-webkit-scrollbar{width:0}

/* ---- bottom bar ---- */
.bottombar{flex:0 0 auto;background:var(--white);border-top:1px solid var(--card-border);
  padding:11px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px}
.estimate{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--dark)}
.estimate.care{color:var(--warn-text)}
.btn{min-height:50px;border-radius:14px;border:0;background:var(--primary);color:var(--white);
  font-size:15.5px;font-weight:700;width:100%;display:grid;place-items:center}
.btn:disabled{background:var(--card-border);color:var(--muted)}
.btn.ghost{background:none;color:var(--muted);min-height:36px;font-size:13.5px}
.btn.alt{background:var(--white);color:var(--primary);border:1.5px solid var(--tint-border)}

/* ---- tab bar ---- */
.tabbar{flex:0 0 auto;background:var(--white);border-top:1px solid var(--card-border);
  display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0;color:var(--muted);font-size:10.5px;font-weight:700;border-radius:12px}
.tab[aria-selected="true"]{color:var(--primary)}

/* ---- generic blocks ---- */
.q{display:flex;flex-direction:column;gap:10px}
.qlabel{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.qhelp{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:-4px}
.sectitle{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--tint);border:1px solid var(--tint-border);border-radius:14px;
  padding:11px 13px;font-size:12.5px;line-height:1.5;color:var(--dark)}
.warnnote{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:14px;
  padding:11px 13px;font-size:12.5px;line-height:1.5;color:var(--warn-text)}
.warnnote strong{font-weight:800}

/* ---- home ---- */
.hometop{display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.brandmark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--white);display:grid;place-items:center;
  font-size:17px;font-weight:800;line-height:1}
.gsec{display:flex;flex-direction:column;gap:12px}
.gsechead{display:flex;flex-direction:column;gap:2px}
.gsectitle{font-size:18px;font-weight:800;letter-spacing:-.02em}
.gsecsub{font-size:12.5px;color:var(--muted);line-height:1.4}
.hbanner{flex:0 0 auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;border-radius:20px;
  padding:18px 16px 18px 18px;background:var(--primary);color:var(--white)}
.hbanner::after{content:"";position:absolute;right:-48px;top:-48px;width:170px;height:170px;border-radius:50%;
  background:rgba(255,255,255,.08)}
.hbtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hbtitle{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hbsub{font-size:12.5px;line-height:1.45;color:#D7F0E7}
.hbtags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.hbtags span{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.16);color:var(--white)}
.hbart{position:relative;z-index:1;width:92px;height:96px;flex:0 0 auto}
.hbart span{position:absolute;display:grid;place-items:center;border-radius:16px;background:var(--white);color:var(--dark);
  box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.hb1{width:58px;height:58px;right:0;top:0}
.hb2{width:46px;height:46px;left:0;top:34px;transform:rotate(-8deg)}
.hb3{width:42px;height:42px;right:8px;bottom:-2px;transform:rotate(6deg)}
.fchips{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:6px 16px 8px;position:sticky;top:-18px;z-index:2;
  background:var(--page)}
.fchips::-webkit-scrollbar{height:0}
.fchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--card-border);background:var(--white);
  border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--text);min-height:38px}
.fchip svg{width:15px;height:15px}
.fchip .n{font-size:11px;font-weight:700;color:var(--muted)}
.fchip[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--white)}
.fchip[aria-selected="true"] .n{color:#CFEDE3}
.fsec{display:flex;flex-direction:column;gap:12px}
.fsechead{display:flex;align-items:center;gap:11px}
.fsechead > span:last-child{display:flex;flex-direction:column;gap:1px;min-width:0}
.fsecicon{width:40px;height:40px;border-radius:12px;background:var(--white);border:1px solid var(--card-border);
  display:grid;place-items:center;color:var(--dark);flex:0 0 auto}
.fsectitle{font-size:18px;font-weight:800;letter-spacing:-.02em}
.fsecsub{font-size:12px;color:var(--muted)}
.gsoon{aspect-ratio:1/1;border:1.5px dashed var(--card-border);border-radius:18px;display:grid;place-items:center;
  text-align:center;padding:10px;font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.35;background:var(--white)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.gcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--text)}
.gtile{position:relative;aspect-ratio:1/1;border-radius:18px;display:grid;place-items:center;
  border:1px solid var(--card-border);transition:transform .12s ease}
.gcard:active .gtile{transform:scale(.97)}
.gtile .timg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.gtile .gplus{z-index:1}
.hero{overflow:hidden}
.hero .himg{width:100%;height:100%;object-fit:cover;display:block}
.gcard:focus-visible{outline:none}
.gcard:focus-visible .gtile{box-shadow:0 0 0 3px var(--tint-border)}
.tone-green  .gtile{background:linear-gradient(160deg,#F3FAF7 0%,#E1F1EA 100%);color:#0B5F4D}
.tone-blue   .gtile{background:linear-gradient(160deg,#F3F6FC 0%,#E1E9F6 100%);color:#2C4F86}
.tone-violet .gtile{background:linear-gradient(160deg,#F6F3FC 0%,#E8E2F6 100%);color:#55408F}
.gplus{position:absolute;right:7px;bottom:7px;width:30px;height:30px;border-radius:10px;background:var(--white);
  color:var(--primary);display:grid;place-items:center;box-shadow:0 2px 8px -2px rgba(20,32,28,.22)}
.gname{font-size:12.8px;font-weight:700;line-height:1.3;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;padding:0 2px}
.hello{font-size:13px;font-weight:700;color:var(--muted)}
.h1{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.protobar{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:14px;
  padding:11px 13px;font-size:12px;line-height:1.5;color:var(--warn-text)}
.cat{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.svclist{display:flex;flex-direction:column;gap:10px}
.svc{display:flex;gap:13px;align-items:center;background:var(--white);border:1px solid var(--card-border);
  border-radius:18px;padding:13px;text-align:left;width:100%}
.svc:active{border-color:var(--tint-border);background:var(--tint)}
.svcicon{width:46px;height:46px;border-radius:14px;background:var(--tint);border:1px solid var(--tint-border);
  display:grid;place-items:center;color:var(--dark);flex:0 0 auto}
.svcbody{flex:1;min-width:0}
.svcname{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.svctag{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.chev{color:var(--muted);flex:0 0 auto}

/* ---- service details ---- */
.hero{height:142px;border-radius:18px;background:var(--tint);border:1px solid var(--tint-border);
  display:grid;place-items:center;color:var(--dark);flex:0 0 auto}
.detailtitle{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.detailsub{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}
.inctiles{display:flex;flex-direction:column;gap:8px}
.inctile{display:flex;gap:11px;align-items:center;background:var(--white);border:1px solid var(--card-border);
  border-radius:15px;padding:10px 12px}
.thumb{width:38px;height:38px;border-radius:11px;background:var(--tint);display:grid;place-items:center;
  color:var(--dark);flex:0 0 auto}
.inctile .txt{font-size:12.8px;font-weight:600;line-height:1.35}
.plainlist{background:var(--white);border:1px solid var(--card-border);border-radius:15px;padding:12px 14px}
.plainlist ul{margin:0;padding-left:17px;font-size:12.8px;line-height:1.65;color:var(--text)}
.plainlist.muted ul{color:var(--muted)}
.emptynote{background:var(--white);border:1px dashed var(--card-border);border-radius:15px;
  padding:13px 14px;font-size:12.5px;color:var(--muted);font-weight:600}
.steps{display:flex;flex-direction:column;gap:10px}
.stepitem{display:flex;gap:11px;align-items:flex-start}
.stepnum{width:25px;height:25px;border-radius:50%;background:var(--tint);border:1px solid var(--tint-border);
  color:var(--dark);font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.steptext{font-size:12.8px;line-height:1.5;padding-top:3px}
.draftbadge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--warn-text);
  background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:5px;padding:1px 4px;margin-left:5px;vertical-align:1px}

/* ---- inputs ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px;background:var(--white);
  border:1px solid var(--card-border);border-radius:16px;padding:4px}
.seg button{min-height:50px;border:0;border-radius:12px;background:none;font-size:13.5px;font-weight:700;
  color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:0 6px}
.seg button .s{font-size:10.5px;font-weight:600;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--white)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{background:var(--white);border:1px solid var(--card-border);border-radius:16px;padding:12px;
  text-align:left;display:flex;flex-direction:column;gap:2px;min-height:78px;justify-content:center}
.card[aria-pressed="true"]{border-color:var(--primary);background:var(--tint);box-shadow:inset 0 0 0 1px var(--primary)}
.card.care[aria-pressed="true"]{border-color:var(--warn-border);background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-border)}
.cname{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.csub{font-size:11px;font-weight:700;color:var(--primary)}
.card.care .csub{color:var(--warn-text)}
.chelp{font-size:10.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--white);border:1px solid var(--card-border);border-radius:13px;padding:9px 13px;
  font-size:12.5px;font-weight:700;color:var(--text);display:flex;flex-direction:column;gap:1px;align-items:flex-start}
.chip .sub{font-size:10px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--white)}
.chip[aria-pressed="true"] .sub{color:rgba(255,255,255,.85)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--white);
  border:1px solid var(--card-border);border-radius:16px}
.row.on{border-color:var(--tint-border);background:var(--tint)}
.rname{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.rsub{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-top:2px;line-height:1.35}
.stepper{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.stepper button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:36px;height:36px;border-radius:11px;border:1px solid var(--card-border);
  background:var(--white);font-size:19px;font-weight:700;color:var(--primary);line-height:1}
.stepper button:disabled{opacity:.3;color:var(--muted)}
.stepper .val{white-space:nowrap;padding:0 4px;min-width:32px;text-align:center;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.numfield{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.numfield input{width:86px;border:1px solid var(--card-border);border-radius:11px;padding:9px;
  font-family:inherit;font-size:14px;font-weight:700;text-align:right;color:var(--text);background:var(--white)}
.numfield input:focus{outline:2px solid var(--primary);outline-offset:-2px}
.numfield .u{font-size:11px;font-weight:700;color:var(--muted)}
.people{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{width:58px;height:58px;border-radius:17px;border:1px solid var(--card-border);background:var(--white);
  font-size:18px;font-weight:800;color:var(--text)}
.pbtn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--white)}
.pbtn.more{width:auto;padding:0 15px;font-size:12px;font-weight:700}
.toggle{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--white);
  border:1px solid var(--card-border);border-radius:16px;text-align:left;width:100%}
.toggle[aria-pressed="true"]{border-color:var(--primary);background:var(--tint)}
.tgbox{width:25px;height:25px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--white);
  display:grid;place-items:center;flex:0 0 auto;color:var(--white)}
.toggle[aria-pressed="true"] .tgbox{background:var(--primary);border-color:var(--primary)}
.textfield{background:var(--white);border:1px solid var(--card-border);border-radius:16px;padding:5px}
.textfield textarea{width:100%;border:0;background:none;font-family:inherit;font-size:13.5px;font-weight:500;
  color:var(--text);padding:10px;min-height:62px;resize:none;line-height:1.5}
.textfield textarea:focus{outline:2px solid var(--primary);outline-offset:-2px;border-radius:12px}
.upload{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--white);
  border:1px dashed var(--card-border);border-radius:16px;padding:18px;position:relative;text-align:center}
.upload input{position:absolute;inset:0;opacity:0}
.uplabel{font-size:13px;font-weight:700;color:var(--primary)}
.upsub{font-size:11px;color:var(--muted)}

/* ---- repeating item lines (Loading & Unloading) ---- */
.linecard{background:var(--white);border:1px solid var(--card-border);border-radius:18px;padding:13px;
  display:flex;flex-direction:column;gap:10px}
.linehead{display:flex;justify-content:space-between;align-items:center}
.linetitle{font-size:14px;font-weight:800;letter-spacing:-.01em}
.linerm{border:0;background:none;color:var(--warn-text);font-size:12px;font-weight:700;padding:6px 2px}
.linecard .row{padding:9px 11px}
.tinput{width:100%;border:1px solid var(--card-border);border-radius:12px;padding:11px;font-family:inherit;
  font-size:13px;font-weight:500;color:var(--text);background:var(--white)}
.tinput:focus{outline:2px solid var(--primary);outline-offset:-2px}
.tinput.need{border-color:var(--warn-border);background:var(--warn-bg)}
.addline{border:1.5px dashed var(--tint-border);background:var(--tint);color:var(--dark);border-radius:16px;
  min-height:50px;font-size:14px;font-weight:800;width:100%}
.inclist{display:grid;grid-template-columns:1fr auto;gap:0;background:var(--white);border:1px solid var(--card-border);border-radius:15px;overflow:hidden}
.inclist span{padding:9px 13px;font-size:12.8px;border-bottom:1px solid var(--card-border)}
.inclist span:nth-child(even){font-weight:800;text-align:right;color:var(--dark)}
.inclist span:nth-last-child(-n+2){border-bottom:0}
.grouplabel{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin:4px 0 -2px}

.ticklist{list-style:none;margin:0;padding:12px 14px;background:var(--white);border:1px solid var(--card-border);
  border-radius:15px;display:flex;flex-direction:column;gap:8px}
.ticklist li{display:flex;gap:9px;align-items:flex-start;font-size:12.8px;line-height:1.4;font-weight:600}
.ticklist svg{flex:0 0 auto;color:var(--primary);margin-top:1px;width:14px;height:14px}
.gotocard{display:flex;gap:11px;align-items:center;background:var(--white);border:1px dashed var(--tint-border);border-radius:16px;padding:12px 13px}
.gotocard .rname{flex:1}
.gotobtn{border:1px solid var(--tint-border);background:var(--tint);color:var(--dark);border-radius:11px;padding:9px 12px;font-size:12px;font-weight:800;flex:0 0 auto}
.pickrow{flex-direction:column;align-items:stretch;gap:10px}
.sepline{height:1px;background:var(--card-border);margin:2px 0}

.tinput.big{font-size:15px;padding:13px}
.opt{font-size:11px;font-weight:600;color:var(--muted);margin-left:6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
a.btn{text-decoration:none}

/* ---- results ---- */
.bigblock{background:var(--tint);border:1px solid var(--tint-border);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:4px}
.bigv{font-size:26px;font-weight:800;color:var(--dark);letter-spacing:-.03em;line-height:1.12}
.bigl{font-size:12px;font-weight:600;color:var(--dark);opacity:.82;line-height:1.45}
.list{background:var(--white);border:1px solid var(--card-border);border-radius:16px;overflow:hidden}
.li{display:flex;justify-content:space-between;gap:14px;padding:11px 13px;font-size:12.8px;
  border-bottom:1px solid var(--card-border)}
.li:last-child{border-bottom:0}
.li .k{color:var(--muted);white-space:nowrap}
.li .v{font-weight:700;text-align:right}
.tbc{font-weight:800;color:var(--warn-text)}
.disclaim{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:16px;padding:13px}
.disctitle{font-size:12.5px;font-weight:800;color:var(--warn-text);margin-bottom:5px}
.disctext{font-size:11.5px;line-height:1.55;color:var(--warn-text)}
.acceptrow{display:flex;gap:10px;align-items:center;margin-top:11px;background:var(--white);
  border:1px solid var(--warn-border);border-radius:12px;padding:10px;width:100%;text-align:left}
.acceptrow .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--warn-border);
  background:var(--white);display:grid;place-items:center;color:var(--white);flex:0 0 auto}
.acceptrow[aria-pressed="true"] .box{background:var(--primary);border-color:var(--primary)}
.accepttext{font-size:11.5px;font-weight:700;color:var(--warn-text);line-height:1.4}

/* ---- care ---- */
.care-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:13px;text-align:center;padding:36px 20px}
.carecircle{width:66px;height:66px;border-radius:50%;background:var(--warn-bg);border:1px solid var(--warn-border);
  display:grid;place-items:center;color:var(--warn-text)}
.caretitle{font-size:19px;font-weight:800;letter-spacing:-.02em}
.caretext{font-size:13px;color:var(--muted);line-height:1.5;max-width:31ch}
.carenum{font-size:15px;font-weight:800;color:var(--dark);font-variant-numeric:tabular-nums}

/* ---- slot ---- */
.dayscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-inline:16px}
.dayscroll::-webkit-scrollbar{height:0}
.day{flex:0 0 auto;width:62px;background:var(--white);border:1px solid var(--card-border);border-radius:15px;
  padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--white)}
.dname{font-size:10.5px;font-weight:700;opacity:.8}
.dnum{font-size:18px;font-weight:800;letter-spacing:-.02em}
.dmon{font-size:9.5px;font-weight:700;opacity:.75}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.slot{background:var(--white);border:1px solid var(--card-border);border-radius:13px;padding:12px 4px;
  font-size:12.5px;font-weight:700;color:var(--text)}
.slot[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--white)}

/* ---- confirmation ---- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:36px 20px}
.donecircle{width:72px;height:72px;border-radius:50%;background:var(--tint);border:1px solid var(--tint-border);
  display:grid;place-items:center;color:var(--primary)}
.donetitle{font-size:21px;font-weight:800;letter-spacing:-.02em}
.ref{font-size:13px;font-weight:800;color:var(--dark);background:var(--tint);border:1px solid var(--tint-border);
  border-radius:10px;padding:7px 13px;font-variant-numeric:tabular-nums}

/* ---- bookings ---- */
.bkcard{background:var(--white);border:1px solid var(--card-border);border-radius:18px;padding:14px;
  display:flex;flex-direction:column;gap:7px}
.bkhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bkname{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.bkref{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bkmeta{font-size:12px;color:var(--muted);line-height:1.5}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px}
.pill.ok{background:var(--tint);color:var(--dark);border:1px solid var(--tint-border)}
.pill.care{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}
.empty{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:52px 20px;color:var(--muted)}
.emptytitle{font-size:16px;font-weight:800;color:var(--text)}
.emptysub{font-size:13px;line-height:1.5;max-width:30ch}
</style>
</head>

/* ============================================================
   SHARED CROSS-SERVICE RULES
   ============================================================ */
const LIMIT = 480;                 // 8 hours of work, every workload service
const BAND = w => w <= 240 ? 1 : 2; // 0-240 = 1 professional, 241-480 = 2
const ROUND_TO = 5;                 // time on site rounds up to 5 min, set 21 Oct (was 15, then 10)
const roundUp = m => Math.ceil(m / ROUND_TO) * ROUND_TO;

function staffing(workload){
  workload = Math.round(workload * 1e6) / 1e6;   // clears float dust such as 120.00000000000003
  if (workload > LIMIT) return {care:true, reason:'More than 8 hours of work'};
  const pros = BAND(workload);
  const each = workload / pros;
  return {care:false, workload, pros, each, onsite:roundUp(each)};
}
function hhmm(m){
  const h = Math.floor(m/60), mm = Math.round(m%60);
  if (h === 0) return mm + ' min';
  if (mm === 0) return h + ' h';
  return h + ' h ' + mm + ' min';
}
const r2 = n => Math.round(n*100)/100;
function fmtVal(kind, v, unit){
  if (kind === 'hhmm') return hhmm(v);
  if (kind === 'ft25') return v ? `+${v*25} ft` : '0';
  if (kind === 'unit') return v ? `${Number(v).toLocaleString('en-IN')} ${unit}` : '0';
  return String(v);
}
// Units that read the same in the singular and the plural.
function unitText(n, u){
  return ['sqft','pcs','ft','L'].indexOf(u) > -1 ? `${Number(n).toLocaleString('en-IN')} ${u}` : plural(n, u);
}
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const plural = (n,w) => n + ' ' + (n === 1 ? w : (w === 'person' ? 'people' : w + 's'));

/* ============================================================

const UI = {
  seg(key, options, sel){
    return `<div class="seg" data-input="seg" data-key="${key}">` + options.map(o =>

  cards(key, items, sel, opt){
    opt = opt || {};
    return `<div class="grid2" data-input="card" data-key="${key}">` + items.map(it =>
      `<button class="card ${it.care?'care':''}" data-v="${it.id}" aria-pressed="${sel===it.id}">
         <span class="cname">${it.name}</span>
         ${it[opt.sub]?`<span class="csub">${it[opt.sub]}</span>`:''}
         ${it.help?`<span class="chelp">${it.help}</span>`:''}
       </button>`).join('') + `</div>`;
  },
  chips(key, items, sel){
    return `<div class="chips" data-input="card" data-key="${key}">` + items.map(it =>
      `<button class="chip" data-v="${it.id}" aria-pressed="${sel===it.id}">${it.label}${it.sub?`<span class="sub">${it.sub}</span>`:''}</button>`
    ).join('') + `</div>`;
  },
  stepRow(key, name, sub, val, min, max, on, o){
    o = o || {};
    return `<div class="row ${on?'on':''}">
      <span class="rname">${name}${sub?`<span class="rsub">${sub}</span>`:''}</span>
      <span class="stepper" data-input="step" data-key="${key}" data-min="${min}" data-max="${max}"
        data-step="${o.step||1}" data-fmt="${o.fmt||''}" data-unit="${o.unit||''}">
        <button data-dir="-1" ${val<=min?'disabled':''} aria-label="Less">–</button>
        <span class="val">${fmtVal(o.fmt||'', val, o.unit||'')}</span>
        <button data-dir="1" ${val>=max?'disabled':''} aria-label="More">+</button>
      </span></div>`;
  },
  people(key, sel, max){
    let h = `<div class="people" data-input="people" data-key="${key}">`;
    for (let n = 1; n <= max; n++) h += `<button class="pbtn" data-v="${n}" aria-pressed="${sel===n}">${n}</button>`;
    h += `<button class="pbtn more" data-v="more">More than ${max}</button></div>`;
    return h;
  },
  toggle(key, name, sub, on){
    return `<button class="toggle" data-input="toggle" data-key="${key}" aria-pressed="${on}">
      <span class="rname">${name}${sub?`<span class="rsub">${sub}</span>`:''}</span>
      <span class="tgbox">${on?I.tick:''}</span></button>`;
  },
  note(key, val, ph){
    return `<div class="textfield"><textarea data-input="text" data-key="${key}" placeholder="${ph}">${esc(val||'')}</textarea></div>`;
  },
  q(label, help, body){
    return `<div class="q"><div class="qlabel">${label}</div>${help?`<div class="qhelp">${help}</div>`:''}${body}</div>`;
  },
  sec(title, body){ return `<div class="q"><div class="sectitle">${title}</div>${body}</div>`; }
};

/* ---------- Included / Not included, placed inside a step or on review (21 Oct) ---------- */
function contentHTML(s, st, where){
  const c = s.content;
  const inc = (where === 'review' && s.reviewIncluded) ? s.reviewIncluded(st) : c.included;
  let h = '';
  if (where === 'step' && s.banner) h += `<div class="warnnote"><strong>${s.banner.title}</strong><br>${s.banner.text}</div>`;
  h += UI.sec("What's included", inc && inc.length
    ? `<ul class="ticklist">${inc.map(t => `<li>${I.tick}<span>${t}</span></li>`).join('')}</ul>`
      + (c.includedNote ? `<div class="note" style="margin-top:9px">${c.includedNote}</div>` : '')
    : `<div class="emptynote">To be confirmed</div>`);
  if (c.notIncluded === null)
    h += UI.sec('Not included', `<div class="emptynote">To be confirmed</div>`);
  else if (c.notIncluded && c.notIncluded.length)
    h += UI.sec('Not included', `<div class="plainlist muted"><ul>${c.notIncluded.map(t => `<li>${t}</li>`).join('')}</ul></div>`);
  if (c.ready && c.ready.length)
    h += UI.sec('Please have ready' + (c.readyDraft ? '<span class="draftbadge">draft</span>' : ''),
      `<div class="plainlist"><ul>${c.ready.map(t => `<li>${t}</li>`).join('')}</ul></div>`);
  return h;
}

const BLOCK_DUR = [{id:'dur_2',hours:2},{id:'dur_4',hours:4}];
const BLOCK_MAX_TOTAL = 4;   // hours per person, capped at 4 "for now", set 21 Oct
const BLOCK_MAX_PEOPLE = 4;  // above this, customer care, set 19 Oct

function blockMaxExtra(st){ return BLOCK_MAX_TOTAL - BLOCK_DUR.find(x => x.id === st.dur).hours; }
function blockCalc(st){
  const d = BLOCK_DUR.find(x => x.id === st.dur);
  st.extra = Math.max(0, Math.min(st.extra, BLOCK_MAX_TOTAL - d.hours)); // switching to 4 hours drops any extra hours
  const per = d.hours + st.extra;
  return {care:false, blocks:true, base:d.hours, extra:st.extra, per,
          people:st.people, totalHours:per*st.people, workload:per*st.people*60};
}
// Since 21 Oct: how many comes first, how long second. `contentOn` picks the screen that carries Included / Not included.
function blockSteps(labels){
  const howMany = {title:'How many', content:labels.contentOn === 'count', build:(st,r) => ''
    + UI.q(labels.countQ, 'You choose the hours on the next step.', UI.people('people', st.people, BLOCK_MAX_PEOPLE))
    + big(plural(r.people, labels.unit), `each working ${hhmm(r.per*60)} unless you change it next`)};
  const howLong = {title:'How long', content:labels.contentOn === 'duration', build:(st,r) => {
    const max = blockMaxExtra(st);
    return UI.q('How long do you need cover?',
        `Everyone in this booking works the same hours, up to ${BLOCK_MAX_TOTAL} hours. For different hours, make a second booking.`,
        UI.seg('dur', BLOCK_DUR.map(d => ({v:d.id, n:d.hours+' hours', s:labels.sub[d.id]})), st.dur))
      + (max > 0 ? UI.q('Need longer?', `Add up to ${plural(max,'more hour')}.`,
          `<div class="rows">` + UI.stepRow('extra','Extra hours',
            st.extra >= max ? 'maximum reached' : (max-st.extra)+' more available', st.extra, 0, max, st.extra>0) + `</div>`) : '')
      + big(hhmm(r.per*60) + ' each', `${plural(r.people,labels.unit)}, everyone starting together · ${r.totalHours} worker-hours`)
      + UI.q('Any special instruction?','Optional. Goes straight to the team.', UI.note('note', st.note, labels.notePh));
  }};
  return [howMany, howLong];
}
function big(v,l){ return `<div class="bigblock"><span class="bigv">${v}</span><span class="bigl">${l}</span></div>`; }

    if (ix > -1) l.types.splice(ix, 1); else l.types.push(t);
    render();
  });
  screen.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { L.splice(+b.dataset.rm, 1); render(); });
  const add = screen.querySelector('#addline');
  if (add) add.onclick = () => { L.push(newLine()); render(); setTimeout(() => { $screen.scrollTop = $screen.scrollHeight; }, 0); };
  screen.querySelectorAll('[data-field]').forEach(inp => {
    const l = L[+inp.dataset.line], f = inp.dataset.field;
    inp.oninput = () => {
      if (f === 'qty') l.qty = Math.max(0, parseInt(inp.value, 10) || 0); else l[f] = inp.value;
      if (f !== 'qty') inp.classList.toggle('need', !inp.value.trim());
      refreshFooter();
    };
    if (f === 'qty') inp.onblur = () => render();
  });
}

function addonMins(a, v){
  if (!v) return 0;
  // Anything with a block size is charged per started block (sqft, tables, groups of 3 fixtures).
  return a.block ? Math.ceil(v / a.block) * a.mins : v * a.mins;
}
function addonRate(a){
  if (a.rate) return a.rate;
  return a.block ? `${a.mins} min per ${unitText(a.block, a.unit)}` : `${a.mins} min each`;
}
function addonRows(list, qty){
  return `<div class="rows">` + list.map(a => {
    const v = qty[a.id] || 0, m = addonMins(a, v);
    const sub = [a.desc ? a.desc.replace(/\.$/, '') : '', addonRate(a), m ? `${m} min` : ''].filter(Boolean).join(' · ');
    return a.kind === 'area'
      ? UI.stepRow('qty.'+a.id, a.name, sub, v, 0, a.max || 10000, v>0, {step:a.block, fmt:'unit', unit:a.unit})
      : UI.stepRow('qty.'+a.id, a.name, sub, v, 0, a.max || 99, v>0);
  }).join('') + `</div>`;
}
function addonLines(list, qty){
  return list.filter(a => (qty[a.id]||0) > 0)
             .map(a => ({a, qty:qty[a.id], mins:addonMins(a, qty[a.id])}));
}
function addonText(a, v){
  return a.kind === 'area' ? unitText(v, a.unit) : plural(v, a.unit);
}

    a.label = a.mode === 'same' ? 'Ground floor' : `${a.mode === 'lift' ? 'Lift' : 'Stairs'}, floor ${st.floor_number}`;
    const lines = st.lines.map(l => {
      const s = LU_SIZE.find(x => x.id === l.size);
      const fs = l.types.map(t => LU_TYPES.find(x => x.id === t).f);
      const tf = fs.length ? fs.reduce((p,c)=>p+c,0) / fs.length : 1;
      return {l, s, tf, mins:(l.qty||0) * s.mins * tf};
    });
    const svcT = LU_SERVICE.find(x => x.id === st.service_type);
    const df = 1 + LU_FT_PCT * st.extraFt;
    const workload = lines.reduce((p,x)=>p+x.mins,0) * svcT.mult * df * a.f;
    return Object.assign({lines, svcT, df, a}, staffing(workload));
  },
  rows:(st,r) => [['Service', r.svcT.name], ['Access', r.a.label + (r.a.f !== 1 ? ` · ×${r.a.f}` : '')]]
    .concat(st.extraFt ? [['Extra distance', `+${st.extraFt*FT_STEP} ft · ×${r2(r.df)}`]] : [])
    .concat(r.lines.map((x,i) => [`Item ${i+1}`,
      `${x.l.qty} × ${x.s.label} · ${x.l.types.map(t => LU_TYPES.find(y=>y.id===t).label).join(', ')}`]))
},

          st.extraFt, 0, 20, st.extraFt>0, {fmt:'ft25'}) + `</div>`);

    const hasWet = st.waste === 'wet' || st.waste === 'mixed';
    const a = accessFactor(st.sameFloor, st.lift, st.floors);
    if (a.stop) return {care:true, reason:`Stairs above ${STAIRS_MAX} floors`, a};
    const n = st.floors, pl = n > 1 ? 's' : '';
    a.label = a.mode === 'same' ? 'Same floor' : `${a.mode === 'lift' ? 'Lift' : 'Stairs'}, ${n} floor${pl}`;
    const d = G_DRY.find(x => x.id === st.dry), w = G_WET.find(x => x.id === st.wet);

    else if (st.waste === 'wet') subtotal = wetBase;
    else subtotal = dryBase >= wetBase ? dryBase + wetMix : wetBase + dryMix;
    const distMins = st.extraFt * GARB_FT_STEP_MIN;
    const workload = subtotal * a.f + distMins;

const TIMES = ['07:00','08:00','09:00','10:00','11:00','12:00','14:00','16:00','18:00','20:00','21:00','22:00'];
function days(){
  const out = [], now = new Date();
  for (let i = 0; i < 10; i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    out.push({d, name:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],
      num:d.getDate(), mon:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]});
  }
  return out;
}
function result(){ return svc ? svc.calc(st) : null; }

/* ============================================================
   ADMIN-EDITED CONTENT (read-only here; edited at /admin)
   Anything missing or failing to load falls back to the content built into this file.
   ============================================================ */
let CONTENT = {};
try { CONTENT = JSON.parse(localStorage.getItem('instaff.content') || '{}') || {}; } catch(e){ CONTENT = {}; }
const IMG_BASE = SUPABASE_URL + '/storage/v1/object/public/service-images/';
function safeImg(u){
  return (SUPABASE_URL && typeof u === 'string' && u.indexOf(IMG_BASE) === 0 && !/["'<>\s]/.test(u)) ? u : '';
}
function txt(v){ return typeof v === 'string' ? v.trim() : ''; }
function svcContent(id){ return (CONTENT.services && CONTENT.services[id]) || {}; }
function applyContent(){
  SERVICES.forEach(sv => {
    if (!('_banner0' in sv)) sv._banner0 = sv.banner || null;
    const c = svcContent(sv.id), t = txt(c.banner && c.banner.title), x = txt(c.banner && c.banner.text);
    if (c.banner_off) sv.banner = null;
    else if (t && x) sv.banner = {title:esc(t), text:esc(x)};
    else sv.banner = sv._banner0;
  });
}
async function loadContent(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000);
    const res = await fetch(SUPABASE_URL + '/rest/v1/site_content?id=eq.main&select=data',
      {headers:{apikey:SUPABASE_ANON_KEY, Authorization:'Bearer ' + SUPABASE_ANON_KEY}, signal:ctl.signal});
    clearTimeout(timer);
    if (!res.ok) return;
    const rows = await res.json();
    if (!rows || !rows[0] || typeof rows[0].data !== 'object') return;
    const fresh = JSON.stringify(rows[0].data);
    if (fresh === JSON.stringify(CONTENT)) return;
    CONTENT = rows[0].data;
    try { localStorage.setItem('instaff.content', fresh); } catch(e){}
    applyContent();
    // Redraw only screens that show this content; a form in progress is left alone.
    if (view === 'home' || view === 'service') render();
  } catch(e){}
}

/* ============================================================
   RENDER
   ============================================================ */
const $top = document.getElementById('topbar');
const $screen = document.getElementById('screen');
const $footer = document.getElementById('footer');

// Redrawing the same screen keeps its scroll position; only a new screen starts at the top.
let lastScreenKey = '';
let lastTrackedKey = '';
function render(){
  const k = [view, svc ? svc.id : '', stepIx, leadMode].join('|');
  const top = k === lastScreenKey ? $screen.scrollTop : 0;
  renderView();
  $screen.scrollTop = top;
  lastScreenKey = k;
  // Screen events fire once per screen, not on every redraw of the same screen.
  if (k !== lastTrackedKey){ lastTrackedKey = k; trackScreen(); }
}
function trackScreen(){
  if (view === 'home') return track('home_viewed');
  if (!svc) return;
  const r = result();
  if (view === 'form')
    return track('step_viewed', {service_id:svc.id, step:stepIx + 1, step_title:svc.steps[stepIx].title});
  if (view === 'care')
    return track('care_shown', {service_id:svc.id, reason:careReasonOf(r)});
  if (view === 'review' && r && !r.care)
    return track('review_viewed', {service_id:svc.id,
      workload_minutes: r.workload,
      professionals: r.blocks ? r.people : r.pros,
      time_on_site_minutes: r.blocks ? r.per*60 : r.onsite});
}
function openService(t, facility){

function renderView(){

/* ---------- customer details (smoke test lead capture) ---------- */
function normPhone(p){
  let d = String(p || '').replace(/\D/g, '');
  if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2);
  if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}
function leadValid(){
  return lead.name.trim().length > 1 && lead.business.trim().length > 1 && !!normPhone(lead.phone);
}
function isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function teamText(r){
  if (r.care) return '';
  return r.blocks ? `${plural(r.people,'person')} · ${hhmm(r.per*60)} each`
                  : `${plural(r.pros,'professional')} · ${hhmm(r.onsite)} on site`;
}
function careReasonOf(r){ return r.reason || svc.careReason || 'This one needs a call'; }
function reviewLines(r){
  try { return svc.rows(st, r).map(([k,v]) => k + ': ' + v); } catch(e){ return []; }
}
function buildLead(r, ref){
  const care = leadMode === 'care';
  const d = days()[slot.day].d;
  // A call back can come from tapping "More than 4", so the on-screen answers may not be what
  // the customer wants. Send only the reason; the team gets the details on the call.
  const lines = care ? [] : reviewLines(r);
  return {
    source:'instaff-prototype', website:lead.website, ref,
    type: care ? 'Call back' : 'Booking',
    service: svc.name,
    facility: (FACILITIES.find(f => f.id === svcFacility) || {}).name || '',
    date: care ? '' : isoDate(d),
    time: care ? '' : slot.time,
    team: care ? '' : teamText(r),
    onsite: care ? '' : (r.blocks ? hhmm(r.per*60) + ' each' : hhmm(r.onsite)),
    details: (care ? ['Reason: ' + careReasonOf(r)] : []).concat(lines).join(' | '),
    note: st.note || '',
    name: lead.name.trim(), business: lead.business.trim(),
    phone: '+91' + normPhone(lead.phone), area: lead.area.trim(),
    utm_source: INTERNAL ? 'internal' : UTM.utm_source, utm_medium: UTM.utm_medium, utm_campaign: UTM.utm_campaign
  };
}
// Apps Script web apps do not answer browser preflight checks, so the row goes as plain text
// with no-cors. The browser cannot read the reply; a network failure still throws, and is shown.
async function sendLead(payload){
  if (!SHEET_URL) return 'not-configured';
  try {
    await fetch(SHEET_URL, {method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
    return 'sent';
  } catch(e){ return 'failed'; }
}

function renderDetails(r){
  const care = leadMode === 'care';
  const total = journey(), n = svc.steps.length;
  if (care) bar(svc.name, 'Request a call back');
  else bar(svc.name, `Step ${n+3} of ${total} · Your details`, total, n+2);
  const ds = days(), d = ds[slot.day];
  const field = (key, label, ph, type, req, help) => `<div class="q">
      <div class="qlabel">${label}${req ? '' : '<span class="opt">optional</span>'}</div>
      ${help ? `<div class="qhelp">${help}</div>` : ''}
      <input class="tinput big" data-lead="${key}" type="${type}" placeholder="${ph}" value="${esc(lead[key]||'')}"
        ${type === 'tel' ? 'inputmode="tel" autocomplete="tel"' : key === 'name' ? 'autocomplete="name"' : key === 'business' ? 'autocomplete="organization"' : ''}>
    </div>`;
  $screen.innerHTML =
    (care
      ? `<div class="warnnote"><strong>${esc(careReasonOf(r))}.</strong> Leave your details and our team will call you to plan the people, the time and the price.</div>`
      : big(`${slot.day===0?'Today':d.name} ${d.num} ${d.mon} · ${slot.time}`, teamText(r)))
    + field('name', 'Your name', 'Full name', 'text', true)
    + field('business', 'Business name', 'Restaurant, shop or company', 'text', true)
    + field('phone', 'Phone number', '10-digit mobile number', 'tel', true, "We'll use this number to confirm your booking.")
    + field('area', 'Area', 'For example Thoraipakkam, OMR', 'text', false)
    + `<input class="hp" data-lead="website" tabindex="-1" autocomplete="off" aria-hidden="true">`
    + (leadError ? `<div class="warnnote">${leadError}</div>` : '');
  const btnText = care ? 'Request a call back' : 'Confirm booking';
  footerBar((care ? `<div class="estimate care">${I.clock}<span>Needs a call</span></div>` : estimateLine(r))
    + `<button class="btn" id="submit" ${leadValid() ? '' : 'disabled'}>${btnText}</button>`);
  const btn = document.getElementById('submit');
  $screen.querySelectorAll('[data-lead]').forEach(inp => {
    inp.oninput = () => { lead[inp.dataset.lead] = inp.value; btn.disabled = !leadValid(); };
  });
  btn.onclick = async () => {
    if (!leadValid() || btn.dataset.busy) return;
    btn.dataset.busy = '1'; btn.disabled = true; btn.textContent = 'Sending…';
    const ref = 'IN' + Math.floor(100000 + Math.random()*899999);
    const payload = buildLead(r, ref);
    track('details_submitted', {service_id:svc.id});
    const res = await sendLead(payload);
    if (res !== 'not-configured') track('lead_sent', {service_id:svc.id, success: res === 'sent'});
    if (res === 'failed'){
      leadError = "<strong>That didn't go through.</strong> Check your internet connection and try again.";
      return render();
    }
    leadError = ''; saveLead();
    bookings.unshift({
      ref, name:svc.name, status: care ? 'care' : 'ok', sheet:res, phone:payload.phone,
      when: care ? 'Call back requested' : `${d.name} ${d.num} ${d.mon} · ${slot.time}`,
      team: care ? careReasonOf(r) : teamText(r),
      wa: [`Instaff ${payload.type.toLowerCase()} ${ref}`, svc.name,
           care ? payload.details : `${payload.date} at ${payload.time} · ${payload.team}`,
           care ? '' : payload.details,
           `${payload.name}, ${payload.business}${payload.area ? ', ' + payload.area : ''}`].filter(Boolean).join('\n')
    });
    saveBookings(); view = 'done'; render();
  };
}

/* ---------- confirmation ---------- */
function renderDone(){
  const b = bookings[0];
  const care = b.status === 'care';
  $top.innerHTML = `<div class="tbrow"><div class="tbtitle">${care ? 'Call back requested' : 'Booked'}</div></div>`;
  $screen.innerHTML = `<div class="done">
      <div class="donecircle">${care ? I.phone : I.bigtick}</div>
      <div class="donetitle">${care ? "We'll call you back" : "You're booked"}</div>
      <div class="caretext">${b.name}<br>${care ? esc(b.team) : b.when + '<br>' + b.team}</div>
      <div class="ref">${b.ref}</div>
      <div class="caretext ph-no-capture">We'll call you on ${esc(b.phone)} to confirm the team and the price before anyone is sent. Nothing is charged here.</div>
    </div>`;
  footerBar((WHATSAPP_NUMBER
      ? `<a class="btn alt" href="https://wa.me/${WHATSAPP_NUMBER.replace(/\D/g,'')}?text=${encodeURIComponent(b.wa)}" target="_blank" rel="noopener" id="wa">Send these details on WhatsApp</a>` : '')
    + `<button class="btn" id="home">Back to services</button>
       <button class="btn ghost" id="mine">See my bookings</button>`);
  const wa = document.getElementById('wa');
  if (wa) wa.onclick = () => track('whatsapp_clicked');
  document.getElementById('home').onclick = () => { view = 'home'; svc = null; slot = {day:0,time:null}; render(); };
  document.getElementById('mine').onclick = () => { view = 'bookings'; svc = null; slot = {day:0,time:null}; render(); };
}

/* ---------- customer care: now a call-back request, captured as a lead ---------- */
function renderCare(r){
  bar(svc.name);
  const reason = careReasonOf(r);
  $screen.innerHTML = `<div class="care-screen">
      <div class="carecircle">${I.phone}</div>
      <div class="caretitle">Let's talk it through</div>
      <div class="caretext">${reason}. Our team will plan the people and the time with you, and confirm a price before anything starts.</div>
      <div class="caretext">Leave your number and we'll call you back.</div>
      ${CARE_NUMBER ? `<a class="carenum" href="tel:${esc(CARE_NUMBER.replace(/[^\d+]/g,''))}">Or call us on ${esc(CARE_NUMBER)}</a>` : ''}
    </div>`;
  footerBar(`<div class="estimate care">${I.clock}<span>Needs a call</span></div>
    <button class="btn" id="callback">Request a call back</button>
    <button class="btn ghost" id="chg">Change my answers</button>`);
  document.getElementById('callback').onclick = () => {
    track('callback_requested', {service_id:svc.id, reason:careReasonOf(r)});
    leadMode = 'care'; leadError = ''; view = 'details'; render(); };
  document.getElementById('chg').onclick = () => { view = 'form'; render(); };
}

/* ============================================================
   INPUT BINDING — one delegated handler set per render
   ============================================================ */
function getKey(key){ return key.split('.').reduce((o,p) => o == null ? o : o[p], st); }
function setKey(key, val){
  if (['sameFloor','lift','ground_floor','service_lift'].indexOf(key) > -1){ st[key] = (val === 'yes'); return; }
  const parts = key.split('.'); let o = st;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}

/* ---------- number selector: tap to step, hold to repeat ---------- */
let hold = null;
function stepBy(cfg, dir, mult){
  const cur = Number(getKey(cfg.key)) || 0, unit = cfg.step * mult;
  let next = mult > 1 ? (dir > 0 ? (Math.floor(cur/unit) + 1) * unit : (Math.ceil(cur/unit) - 1) * unit)
                      : cur + dir * cfg.step;
  next = Math.max(cfg.min, Math.min(cfg.max, next));
  if (next === cur) return false;
  setKey(cfg.key, next); return true;
}
function holdPaint(cfg){
  const v = Number(getKey(cfg.key)) || 0;
  const val = cfg.el.querySelector('.val'); if (val) val.textContent = fmtVal(cfg.fmt, v, cfg.unit);
  const btns = cfg.el.querySelectorAll('button');
  if (btns[0]) btns[0].disabled = v <= cfg.min;
  if (btns[1]) btns[1].disabled = v >= cfg.max;
  refreshFooter();
}
function holdStart(cfg, dir){
  holdStop(false);
  if (!stepBy(cfg, dir, 1)) return;
  holdPaint(cfg);
  const long = (cfg.max - cfg.min) / cfg.step > 40;   // e.g. item counts and sqft, not durations
  let n = 0;
  hold = {t:null};
  const tick = () => {
    n++;
    const mult = !long ? 1 : n < 8 ? 1 : n < 22 ? 5 : 10;
    if (!stepBy(cfg, dir, mult)) return holdStop(true);
    holdPaint(cfg);
    hold.t = setTimeout(tick, 85);
  };
  hold.t = setTimeout(tick, 420);
}
function holdStop(redraw){
  if (!hold) return;
  clearTimeout(hold.t); hold = null;
  if (redraw !== false) render();
}
['pointerup','pointercancel','blur'].forEach(ev => window.addEventListener(ev, () => holdStop(true)));
document.addEventListener('visibilitychange', () => holdStop(true));
function bindInputs(){
  $screen.querySelectorAll('[data-input="seg"] button, [data-input="card"] button').forEach(b => {
    b.onclick = () => { setKey(b.closest('[data-key]').dataset.key, b.dataset.v); render(); };
  });
  // "Book it separately" links that open another service
  $screen.querySelectorAll('[data-goto]').forEach(b => {
    b.onclick = () => {
      const t = byId(b.dataset.goto); if (!t) return;
      openService(t);
    };
  });
  $screen.querySelectorAll('[data-input="pick"] button').forEach(b => {
    b.onclick = () => { setKey(b.closest('[data-key]').dataset.key, Number(b.dataset.v)); render(); };
  });
  $screen.querySelectorAll('[data-input="people"] button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.v === 'more'){ view = 'care'; render(); return; }
      setKey(b.closest('[data-key]').dataset.key, Number(b.dataset.v)); render();
    };
  });
  $screen.querySelectorAll('[data-input="step"]').forEach(w => {
    const cfg = {key:w.dataset.key, min:+w.dataset.min, max:+w.dataset.max, step:+(w.dataset.step||1),
                 fmt:w.dataset.fmt||'', unit:w.dataset.unit||'', el:w};
    w.querySelectorAll('button').forEach(b => {
      const dir = Number(b.dataset.dir);
      b.onpointerdown = e => { if (b.disabled) return; e.preventDefault(); holdStart(cfg, dir); };
      b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (stepBy(cfg, dir, 1)) render(); } };
      b.oncontextmenu = e => e.preventDefault();
    });
  });
  $screen.querySelectorAll('[data-input="num"]').forEach(inp => {
    inp.oninput = () => {
      let v = Math.max(0, Math.floor(Number(inp.value) || 0));
      if (inp.dataset.max) v = Math.min(v, Number(inp.dataset.max));
      setKey(inp.dataset.key, v); refreshFooter();
    };
    inp.onblur = () => render();
  });
  $screen.querySelectorAll('[data-input="toggle"]').forEach(b => {
    b.onclick = () => { const k = b.dataset.key; st[k] = !st[k]; render(); };
  });
  $screen.querySelectorAll('[data-input="text"]').forEach(t => {
    t.oninput = () => { st[t.dataset.key] = t.value; };
  });
  $screen.querySelectorAll('[data-input="photo"]').forEach(p => {
    p.onchange = () => { st.photo = p.files && p.files[0] ? p.files[0].name : ''; render(); };
  });
  $screen.querySelectorAll('[data-input="day"] button').forEach(b => {
    b.onclick = () => { slot.day = Number(b.dataset.v); render(); };
  });
  $screen.querySelectorAll('[data-input="time"] button').forEach(b => {
    b.onclick = () => {
      slot.time = b.dataset.v;
      track('slot_selected', {service_id:svc.id, day_offset:slot.day, hour:parseInt(slot.time, 10)});
      render();
    };
  });
}
function refreshFooter(){
  const r = result();
  const est = $footer.querySelector('.estimate');
  if (est && r) est.outerHTML = estimateLine(r);
  const nx = document.getElementById('next');
  if (nx && view === 'form' && svc.valid) nx.disabled = !r.care && !svc.valid(st);
}

/* ---------- back ---------- */
function goBack(){
  if (view === 'service'){ view = 'home'; svc = null; return render(); }
  if (view === 'care'){ view = 'form'; return render(); }
  if (view === 'form'){
    if (stepIx > 0){ stepIx--; return render(); }
    if (svc.skipDetails){ view = 'home'; svc = null; return render(); }
    view = 'service'; return render();
  }
  if (view === 'review'){ view = 'form'; stepIx = svc.steps.length - 1; return render(); }
  if (view === 'slot'){ view = 'review'; return render(); }
  if (view === 'details'){ leadError = ''; view = leadMode === 'care' ? 'care' : 'slot'; return render(); }
  view = 'home'; svc = null; render();
}

applyContent();
render();
loadContent();
</script>
